name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend (Lint & Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint and format check (Ruff)
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run backend tests (Pytest)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vault_test
          VAULT_LLM_PROVIDER: mock
          JWT_SECRET: test-secret-ci-key-vault-2026
        run: |
          pytest backend/tests -v

  frontend:
    name: Frontend (Lint, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Lint frontend (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests (Vitest)
        working-directory: frontend
        run: npm run test

      - name: Build frontend production bundle (Vite)
        working-directory: frontend
        run: npm run build
